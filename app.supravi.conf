server {
    listen 80;
    #server_name app.supravi.ai;
    server_name 192.168.0.76;

    # Redirect to HTTPS for requests not for the specified endpoints
    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certot;
        try_files $uri =404;
    }

    location ~ ^/(instances|transfers|studies|patients)(/.*)?$ {
        # Capture the endpoint (instances, transfers, or studies) and pass it to the proxy
        set $endpoint $1;

        # Capture the rest of the URI and append it to the endpoint
        set $remainder $2;

        # Append a trailing slash if $remainder is empty
        if ($remainder = "") {
            set $remainder "/";
        }

        # Proxy to the combined endpoint
        proxy_pass http://172.17.0.1:8042/$endpoint$remainder;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # CORS headers
        add_header Access-Control-Allow-Origin "$http_origin";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin,authorization, X-Requested-With, Content-Type, Accept";

        # Allow OPTIONS requests
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
            return 200;
        }
    }
}

server {
    listen 443 ssl;

    #server_name app.supravi.ai;
    server_name 192.168.0.76;
    ssl_certificate /etc/letsencrypt/live/app.supravi.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.supravi.ai/privkey.pem;
    client_max_body_size 250M;
    access_log /var/log/nginx/app.log;
    root /var/www/build;
    index index.html index.htm;
    # commenting out this by shiv to not serve old supravi
    #try_files $uri /index.html;
    # Redirect root "/" to "/supravi/"
    location = / {
        return 301 /supravi/;
    }


    #    location = /viewer {
    #      return 301 /viewer/;
    #    }
    #    location /viewer/ {
    #       alias /var/www/viewer/;
    #       index index.html;
    #       try_files $uri $uri/ /viewer/index.html;
    #       add_header Access-Control-Allow-Origin "$http_origin";
    #       add_header Cross-Origin-Opener-Policy same-origin;
    #       add_header Cross-Origin-Embedder-Policy require-corp;
    #    }
    location /viewer {
        root /var/www/;

        # Disable caching by setting Cache-Control header
        #add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        #add_header Pragma "no-cache";
        #add_header Expires "0";

        add_header Access-Control-Allow-Origin "$http_origin";
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # Immediately redirect /supravi without slash to /supravi/ to eliminate white screens
    location = /supravi {
        return 301 /supravi/;
    }

    # ADD THIS NEW LOCATION BLOCK FOR YOUR NEW SUPRAVI DASHBOARD:
    location /supravi/ {
        root /var/www;
        index index.html;
        try_files $uri $uri.html $uri/ /supravi/index.html;
    }


    location /dicom-web {
        proxy_pass http://172.17.0.1:8042/dicom-web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        add_header Access-Control-Allow-Origin "$http_origin";
        add_header 'Access-Control-Allow_Credentials' 'true';
        add_header 'Access-Control-Allow-Headers' 'Authorization,Accept,Origin,DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Content-Range,Range';
        add_header 'Access-Control-Allow-Methods' 'GET,POST,OPTIONS,PUT,DELETE,PATCH';
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header Authorization "Basic cGFjc2FkbWluOmxrc2okODc2MzQ1";
    }

    # DICOM-web2 location (handled by app on port 8000)
    location /proxy/ {
