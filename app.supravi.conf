    }


    location /dicom-cases {
        proxy_pass http://172.17.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://172.17.0.1:4000;

        # Recommended headers for Next.js static assets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: caching for static files
        proxy_cache_bypass $http_upgrade;
        proxy_http_version 1.1;
    }

    location /_next/ {
        proxy_pass http://172.17.0.1:4000;

        # Recommended headers for Next.js static assets
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Optional: caching for static files
        proxy_cache_bypass $http_upgrade;
        proxy_http_version 1.1;
    }


    location ~ ^/(instances|transfers|studies|patients)(/.*)?$ {
        # Capture the endpoint (instances, transfers, or studies) and pass it to the proxy
        set $endpoint $1;

        # Capture the rest of the URI and append it to the endpoint
        set $remainder $2;

        # Append a trailing slash if $remainder is empty
        if ($remainder = "") {
            set $remainder "/";
        }

        # Proxy to the combined endpoint
        #proxy_pass http://172.17.0.1:8042/$endpoint$remainder;
        proxy_pass http://172.17.0.1:8042/$endpoint$remainder$is_args$args;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # CORS headers
        add_header Access-Control-Allow-Origin "$http_origin";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin,authorization, X-Requested-With, Content-Type, Accept";

        # Allow OPTIONS requests
        if ($request_method = OPTIONS) {
            return 200;
        }
    }

    location /node/ {
        proxy_pass http://172.17.0.1:5500/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin,authorization, X-Requested-With, Content-Type, Accept, Type";
        # Allow OPTIONS requests
        #if ($request_method = OPTIONS) {
        #    add_header 'Access-Control-Allow-Origin' '*';
        #    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
        #    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization';
        #    return 200;
        #}
    }
    location /downloads/ {
        alias /var/www/downloads/;

        auth_basic "Downloads";
        auth_basic_user_file /etc/nginx/.htpasswd;

        autoindex on;
    }
}